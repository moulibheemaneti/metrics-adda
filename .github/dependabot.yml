version: 2

updates:

   # ─── Bun dependencies ─────────────────────────────────────────────────────
   # Must be "bun", not "npm". Both resolve versions from the npm registry, but
   # only the "bun" ecosystem can rewrite bun.lock. Under "npm" Dependabot bumps
   # package.json and leaves the lockfile stale, so every PR fails CI at
   # `bun install --frozen-lockfile`. Requires the text-based bun.lock (not the
   # legacy binary bun.lockb) and Bun >= 1.1.39.
   - package-ecosystem: "bun"
     directory: "/"
     schedule:
        interval: "weekly"
        day: "saturday" # weekend run — review fresh deps before the week starts
        time: "09:00"
        timezone: "Asia/Kolkata"
     open-pull-requests-limit: 10 # max open PRs at once — prevents inbox flooding

     # Group updates together to reduce PR noise
     # Instead of 20 PRs for 20 packages, you get a few grouped PRs
     groups:
        nuxt-ecosystem:
           patterns:
              - "nuxt"
              - "@nuxt/*"
              - "vue"
              - "@vue/*"
           update-types:
              - "major"
              - "minor"
              - "patch"

        linting-tools:
           patterns:
              - "eslint*"
              - "@eslint/*"
              - "stylelint*"
              - "@stylistic/*"
              - "@moulibheemaneti/commitguard"
           update-types:
              - "minor"
              - "patch"

        testing-tools:
           patterns:
              - "vitest*"
              - "@vitest/*"
              - "@vue/test-utils"
              - "happy-dom"
              - "@nuxt/test-utils"
              - "playwright*"
           update-types:
              - "minor"
              - "patch"

     # Commit messages follow your conventional commits standard
     commit-message:
        prefix: "chore"
        prefix-development: "chore"
        include: "scope"

     # Auto-assign yourself as reviewer
     reviewers:
        - "moulibheemaneti" # replace with your GitHub username

     labels:
        - "dependencies"

   # ─── GitHub Actions ───────────────────────────────────────────────────────
   - package-ecosystem: "github-actions"
     directory: "/"
     schedule:
        interval: "weekly"
        day: "saturday"
        time: "09:00"
        timezone: "Asia/Kolkata"
     commit-message:
        prefix: "ci"
     labels:
        - "dependencies"
        - "ci"
